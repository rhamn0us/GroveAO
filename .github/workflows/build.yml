# Per-platform matrix: install Qt, configure + build, test, package, upload.
name: CI Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  formatting-check:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v4
     - name: Run clang-format style check for C++
       uses: jidicula/clang-format-action@v4.12.0
       with:
         clang-format-version: '17'
         check-path: 'src'
         fallback-style: LLVM

  build-windows:
    name: Windows x86_64
    needs: formatting-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@master
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.5.3
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          cache: true
          cache-key-prefix: install-qt-action
          modules: 'qtimageformats qtwebsockets'

      - name: Configure
        shell: bash
        env:
          BUILD_CONFIG: Release
        run: ./configure.sh

      - name: Build
        shell: bash
        run: |
          source build.env
          "$NINJA"

      - name: Run tests
        shell: bash
        run: ctest --output-on-failure

      - name: Package
        shell: bash
        run: ./scripts/package-windows.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GroveAO-Windows
          path: dist/GroveAO-windows-*.zip
          archive: false

  build-linux:
    name: Linux x86_64
    needs: formatting-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@master
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          cache: true
          cache-key-prefix: install-qt-action
          modules: 'qtimageformats qtwebsockets'

      - name: Configure
        env:
          BUILD_CONFIG: Release
        run: ./configure.sh

      - name: Build
        run: |
          source build.env
          "$NINJA"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      - name: Package
        run: ./scripts/package-linux.sh

      - name: Upload Dynamic Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GroveAO-Linux-Dynamic
          path: dist/GroveAO-linuxdynamic-*.zip
          archive: false

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GroveAO-Linux-AppImage
          path: dist/GroveAO-linuxappimage-*.zip
          archive: false

  build-linux-arm:
    name: Linux arm64
    needs: formatting-check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@master
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          # Qt ships Linux ARM64 desktop binaries only from 6.7 onward.
          version: '6.8.3'
          host: 'linux_arm64'
          target: 'desktop'
          arch: 'linux_gcc_arm64'
          cache: true
          cache-key-prefix: install-qt-action
          modules: 'qtimageformats qtwebsockets'

      - name: Configure
        env:
          BUILD_CONFIG: Release
        run: ./configure.sh

      - name: Build
        run: |
          source build.env
          "$NINJA"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      - name: Package
        run: ./scripts/package-linux.sh

      - name: Upload Dynamic Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GroveAO-Linux-arm64-Dynamic
          path: dist/GroveAO-linuxdynamic-*.zip
          archive: false

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GroveAO-Linux-arm64-AppImage
          path: dist/GroveAO-linuxappimage-*.zip
          archive: false

  build-macos:
    name: macOS arm64
    needs: formatting-check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@master
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true
          cache-key-prefix: install-qt-action
          modules: 'qtimageformats qtwebsockets'

      - name: Configure
        env:
          BUILD_CONFIG: Release
        run: ./configure.sh

      - name: Build
        run: |
          source build.env
          "$NINJA"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      - name: Package
        run: ./scripts/package-macos.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GroveAO-macOS
          path: dist/GroveAO-macos-*.zip
          archive: false

  build-android:
    name: Android arm64
    needs: formatting-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@master
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cross-compiling Qt needs a desktop Qt of the same version for moc/rcc/uic.
      - name: Install Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          dir: ${{ runner.temp }}
          cache: true
          cache-key-prefix: install-qt-action-host
          modules: 'qtimageformats qtwebsockets'

      # Installed with aqt directly: clearer errors than the action for Android kits.
      - name: Install Qt (Android)
        run: |
          python3 -m pip install "aqtinstall==3.1.*"
          aqt list-qt linux android --arch 6.5.3
          aqt install-qt linux android 6.5.3 android_arm64_v8a \
            -m qtimageformats qtwebsockets -O "$RUNNER_TEMP/Qt"
          ls "$RUNNER_TEMP/Qt/6.5.3"

      # Qt 6.5 expects NDK r25b.
      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.1.8937393" "platforms;android-33" "build-tools;33.0.2"

      # Qt 6.5.3 bundles AGP 7.4.1, whose aapt2 cannot read android.jar from API 35+
      # ("RES_TABLE_TYPE_TYPE entry offsets overlap actual entry data"). androiddeployqt
      # uses the highest platform it finds (the runner ships names like android-36.1,
      # android-37.0, android-37.2-beta1), so delete every platform except android-33.
      - name: Keep only Android platform 33
        run: |
          cd "$ANDROID_HOME/platforms"
          for d in */; do
            d="${d%/}"
            if [ "$d" != "android-33" ]; then echo "Removing $d"; rm -rf "$d"; fi
          done
          echo "Remaining platforms:"; ls
          test -f android-33/android.jar

      - name: Build APK
        env:
          QT_HOST: ${{ runner.temp }}/Qt/6.5.3/gcc_64
          QT_ANDROID: ${{ runner.temp }}/Qt/6.5.3/android_arm64_v8a
        run: |
          # ANDROID_HOME is set by the runner image; ${{ env.* }} can't see it, the shell can.
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/25.1.8937393"
          ls "$ANDROID_NDK_ROOT" > /dev/null
          bash ./scripts/build-android.sh arm64-v8a

      # androiddeployqt --release produces an UNSIGNED apk, which Android refuses to install.
      # zipalign + apksigner (build-tools 33.0.2) fix that. Uses the repo secrets below; if they
      # are missing (forks, PRs) it falls back to a throwaway keystore so the APK still installs
      # (but such builds can't be updated over a properly signed release).
      #   ANDROID_KEYSTORE_BASE64   base64 of your .jks/.keystore   (base64 -w0 release.jks)
      #   ANDROID_KEYSTORE_PASSWORD keystore password
      #   ANDROID_KEY_ALIAS         key alias
      #   ANDROID_KEY_PASSWORD      key password (same as keystore password if unsure)
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/33.0.2"
          UNSIGNED="$(find build-android-arm64-v8a -name 'AttorneyOnline.apk' | head -n1)"
          [ -n "$UNSIGNED" ] || UNSIGNED="$(find build-android-arm64-v8a -name '*-release-unsigned.apk' | head -n1)"
          [ -n "$UNSIGNED" ] || { echo "No APK found"; find build-android-arm64-v8a -name '*.apk'; exit 1; }
          echo "Signing $UNSIGNED"

          KS="$RUNNER_TEMP/release.jks"
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
          else
            echo "::warning::Signing secrets not set; using a temporary throwaway keystore."
            KS_PASS="android"; KEY_PASS="android"; KEY_ALIAS="grove-ci"
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=GroveAO CI, O=GroveAO"
          fi
          : "${KEY_PASS:=$KS_PASS}"

          mkdir -p dist
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          KS_PASS="$KS_PASS" KEY_PASS="$KEY_PASS" "$BT/apksigner" sign \
            --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out dist/GroveAO-android-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose dist/GroveAO-android-arm64.apk
          rm -f "$KS"
          ls -la dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GroveAO-Android
          path: dist/GroveAO-android-arm64.apk
          archive: false
